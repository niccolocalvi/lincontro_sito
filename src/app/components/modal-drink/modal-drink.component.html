<!-- Button to Open Modal -->
  <button onclick="modalDrinks.showModal()" class="px-6 py-3 text-white bg-[#C19A6B] rounded-lg shadow-lg hover:bg-[#A97D50] transition">
    Drinks
  </button>

  <!-- Modal -->
  <dialog onclick="modalDrinks.close()" id="modalDrinks" class="p-6 bg-white rounded-lg shadow-lg w-[80%] h-[80vh] m-auto ">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">Drinks</h2>
      <button onclick="modalDrinks.close()" class="text-gray-600 hover:text-gray-900 text-2xl">&times;</button>
    </div>
    <div>
      <app-price-table [menu]="drinksMenu"></app-price-table>
    </div>
</dialog>
