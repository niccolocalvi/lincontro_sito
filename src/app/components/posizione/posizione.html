<section id="dove-trovarci" class="section w-full bg-page">
  <div class="container-page">
    <!-- Intestazione -->
    <div class="mb-10 flex flex-col gap-6 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <span class="eyebrow">Valcanneto (RM)</span>
        <h2 class="section-title">Dove <span class="font-custom text-primary">trovarci</span></h2>
        <p class="mt-4 text-base text-muted sm:text-lg">
          Largo Claudio Monteverdi 19, Valcanneto (RM)
        </p>
      </div>
      <a
        href="https://maps.app.goo.gl/g7GVx5YMuNBBDDkMA"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-dark self-start sm:self-auto"
      >
        <i class="fa-solid fa-diamond-turn-right"></i>
        <span>Indicazioni stradali</span>
      </a>
    </div>

    <!-- Container della mappa con gestione cookie -->
    <div
      class="relative h-[380px] w-full overflow-hidden rounded-3xl border border-border sm:h-[460px]"
    >
      <!-- Se NON c'è il consenso, mostra il box dei cookie -->
      @if (!mapConsent()) {
        <div
          class="absolute inset-0 z-10 flex flex-col items-center justify-center bg-surface-map p-6 text-center"
        >
          <span
            class="mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-surface text-xl text-primary shadow-card"
          >
            <i class="fa-solid fa-location-dot"></i>
          </span>
          <p class="mb-6 max-w-md text-sm text-body md:text-base">
            Per visualizzare la mappa di Google Maps e accettare i cookie associati, clicca sul
            pulsante sottostante.
          </p>
          <button type="button" (click)="acceptMap()" class="btn-primary cursor-pointer">
            Attiva Mappa e Consenti Cookie
          </button>
        </div>
      } @else {
        <!-- Consenso dato: mostra la mappa -->
        <iframe
          title="Mappa di L'Incontro a Valcanneto"
          class="h-full w-full border-0"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2967.467843697647!2d12.152816775886183!3d41.94728516107992!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x132f542c37f4964f%3A0x6da1167ae50c4914!2sLargo%20Claudio%20Monteverdi%2C%2019%2C%2000052%20Valcanneto%20RM!5e0!3m2!1sit!2sit!4v1791898820851!5m2!1sit!2sit"
          width="600"
          height="450"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        >
        </iframe>
      }
    </div>
  </div>
</section>
