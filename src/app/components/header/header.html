<header class="sticky top-0 z-50 w-full border-b border-border/70">
  <!-- Sfondo sfocato su un layer separato: un backdrop-filter sull'header
       farebbe da containing block al menu mobile `fixed`, tagliandolo -->
  <div
    class="absolute inset-0 -z-10 bg-surface/80 backdrop-blur-xl backdrop-saturate-150"
    aria-hidden="true"
  ></div>

  <div class="container-page grid h-16 grid-cols-[auto_1fr_auto] items-center sm:h-[72px]">
    <!-- 1. SINISTRA: Logo -->
    <a href="#home" class="flex items-center" aria-label="L'Incontro, torna all'inizio">
      <img
        src="https://cdn.lincontrobar.it/img/incontro_logo_orizzontale.webp"
        alt="L'Incontro Café & Bistrot"
        class="h-10 w-auto sm:h-11"
      />
    </a>

    <!-- 2. CENTRO: Navigazione Desktop (Nascosta su mobile, visibile da md in su) -->
    <nav class="flex justify-center" aria-label="Navigazione principale">
      <ul class="hidden items-center gap-1 text-[15px] md:flex lg:gap-2">
        @for (voce of vociMenu; track voce.href) {
          <li>
            <a
              [href]="voce.href"
              class="group relative rounded-full px-3 py-2 font-medium text-body transition-colors hover:text-heading"
            >
              {{ voce.label }}
              <span
                class="absolute inset-x-3 -bottom-0.5 h-px origin-left scale-x-0 bg-primary transition-transform duration-300 group-hover:scale-x-100"
              ></span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <!-- 3. DESTRA: Pulsante Prenota (Desktop) + Hamburger/X (SOLO Mobile) -->
    <div class="flex items-center justify-end gap-2">
      <a
        [href]="linkPrenota"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-primary hidden !py-2.5 lg:inline-flex"
      >
        <i class="fa-brands fa-whatsapp text-base"></i>
        <span>Prenota un tavolo</span>
      </a>

      <!-- Pulsante Hamburger / X: visibile SOLO su telefono -->
      <button
        type="button"
        (click)="toggleMenu()"
        [attr.aria-label]="isMenuOpen() ? 'Chiudi menu' : 'Apri menu'"
        [attr.aria-expanded]="isMenuOpen()"
        class="relative z-50 -mr-2 flex h-11 w-11 items-center justify-center rounded-full text-heading transition-colors hover:bg-surface-soft md:hidden"
      >
        @if (!isMenuOpen()) {
          <!-- Icona Hamburger -->
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-width="1.75" d="M4 8h16M4 16h16" />
          </svg>
        } @else {
          <!-- Icona a "X" (Chiudi) -->
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-width="1.75" d="M6 18L18 6M6 6l12 12" />
          </svg>
        }
      </button>
    </div>
  </div>

  <!-- 4. MENU A TENDINA MOBILE A SCHERMO INTERO: visibile SOLO su telefono quando isMenuOpen è true -->
  @if (isMenuOpen()) {
    <div
      class="fixed inset-x-0 top-16 bottom-0 z-40 flex flex-col justify-between overflow-y-auto bg-surface px-6 pt-6 pb-10 md:hidden"
    >
      <ul class="flex flex-col divide-y divide-border-subtle">
        @for (voce of vociMenu; track voce.href) {
          <li>
            <a
              [href]="voce.href"
              (click)="closeMenu()"
              class="flex items-center justify-between py-4 font-heading text-2xl text-heading transition-colors hover:text-primary"
            >
              {{ voce.label }}
              <i class="fa-solid fa-arrow-right text-sm text-muted-lighter"></i>
            </a>
          </li>
        }
      </ul>

      <a
        [href]="linkPrenota"
        target="_blank"
        rel="noopener noreferrer"
        class="btn-primary mt-8 w-full !py-4 text-base"
      >
        <i class="fa-brands fa-whatsapp text-lg"></i>
        <span>Prenota un tavolo</span>
      </a>
    </div>
  }
</header>
