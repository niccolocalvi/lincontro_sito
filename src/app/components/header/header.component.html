<header class="w-full bg-white shadow-md relative z-50">
  <div class="w-full grid grid-cols-[auto_1fr_auto] items-center px-6 py-4">
    
    <!-- 1. SINISTRA: Logo -->
    <div class="flex items-center justify-start">
      <img src="incontro_logo_orizzontale.png" alt="incontro_logo_orizzontale" class="h-12 w-auto" />
    </div>

    <!-- 2. CENTRO: Navigazione Desktop (Nascosta su mobile, visibile da md in su) -->
    <nav class="flex justify-center">
      <ul class="hidden md:flex space-x-8 items-center text-lg">
        <li><a href="#home" class="text-gray-900 font-semibold hover:text-[#C19A6B] transition-colors">Home</a></li>
        <li><a href="#chi-siamo" class="text-gray-900 font-semibold hover:text-[#C19A6B] transition-colors">Chi siamo</a></li>
        <li><a href="#menu" class="text-gray-900 font-semibold hover:text-[#C19A6B] transition-colors">Menu</a></li>
        <li><a href="#eventi" class="text-gray-900 font-semibold hover:text-[#C19A6B] transition-colors">Eventi</a></li>
        <li><a href="#dove-trovarci" class="text-gray-900 font-semibold hover:text-[#C19A6B] transition-colors">Dove trovarci</a></li>
        <li><a href="#info-e-contatti" class="text-gray-900 font-semibold hover:text-[#C19A6B] transition-colors">Info e contatti</a></li>
      </ul>
    </nav>

    <!-- 3. DESTRA: Pulsante Eventi (Desktop) + Hamburger (SOLO Mobile) -->
    <div class="flex items-center justify-end space-x-4">
      
      <!-- Pulsante Eventi (Visibile solo da lg in su) -->
      <a href="#eventi" class="hidden lg:flex items-center space-x-3 py-2 px-4 bg-[#FF8C00] text-white rounded-lg transition-all duration-400 transform hover:scale-105 cursor-pointer hover:shadow-lg no-underline">
        <span>Scopri subito i nostri eventi</span>
        <span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
          </svg>
        </span>
      </a>

      <!-- Pulsante Hamburger: visibile SOLO su telefono grazie a md:hidden -->
      <button (click)="toggleMenu()" aria-label="Menu" class="md:hidden text-gray-800 hover:text-[#C19A6B] focus:outline-none p-2">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

    </div>
  </div>

  <!-- 4. MENU A TENDINA MOBILE: visibile SOLO su telefono quando isMenuOpen è true -->
  <div [class.hidden]="!isMenuOpen" class="md:hidden bg-white border-t border-gray-100 px-6 py-4 shadow-xl">
    <ul class="flex flex-col space-y-4 text-base font-semibold text-gray-900">
      <li><a href="#home" (click)="toggleMenu()" class="block hover:text-[#C19A6B] transition-colors">Home</a></li>
      <li><a href="#chi-siamo" (click)="toggleMenu()" class="block hover:text-[#C19A6B] transition-colors">Chi siamo</a></li>
      <li><a href="#menu" (click)="toggleMenu()" class="block hover:text-[#C19A6B] transition-colors">Menu</a></li>
      <li><a href="#eventi" (click)="toggleMenu()" class="block hover:text-[#C19A6B] transition-colors">Eventi</a></li>
      <li><a href="#dove-trovarci" (click)="toggleMenu()" class="block hover:text-[#C19A6B] transition-colors">Dove trovarci</a></li>
      <li><a href="#info-e-contatti" (click)="toggleMenu()" class="block hover:text-[#C19A6B] transition-colors">Info e contatti</a></li>
    </ul>
    
    <div class="mt-4 pt-4 border-t border-gray-100">
      <a href="#eventi" (click)="toggleMenu()" class="flex justify-center items-center space-x-2 py-2.5 px-4 bg-[#FF8C00] text-white rounded-lg font-bold text-sm shadow-md">
        <span>Scopri subito i nostri eventi</span>
      </a>
    </div>
  </div>
</header>
